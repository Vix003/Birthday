<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose A Cake</title>
    <link rel="stylesheet" href="Question.css">
</head>
<body>
    <div class="border"></div>
    <div class="container">
        <h1>WHAT CAKE WOULD YOU LIKE? 🎂</h1>
        <div class="cake-buttons">
            <button class="cake-btn chocolate" data-flavor="chocolate">Chocolate</button>
            <button class="cake-btn vanilla" data-flavor="vanilla">Vanilla</button>
            <button class="cake-btn redvelvet" data-flavor="redvelvet">Red Velvet</button>
        </div>
    </div>
    <script src="Question.js"></script>
</body>
</html>
